name: Update Homebrew Formula

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish to the Homebrew tap, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate binary formula
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          source/.github/scripts/update-homebrew-formula.sh

      - name: Commit formula
        working-directory: homebrew-tap
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula/pearl.rb; then
            echo "Formula already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pearl.rb
          git commit -m "Update pearl to ${TAG_NAME}"
          git push
