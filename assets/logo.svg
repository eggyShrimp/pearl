<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Pearl sphere -->
  <circle cx="30" cy="30" r="20" fill="url(#pearl-gradient)" stroke="#c4b5a0" stroke-width="1.5"/>
  <ellipse cx="24" cy="22" rx="6" ry="4" fill="white" opacity="0.6"/>
  <!-- Text -->
  <text x="60" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#2d2d2d" letter-spacing="-0.5">pearl</text>
  <!-- Definitions -->
  <defs>
    <radialGradient id="pearl-gradient" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="50%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#c4b5a0"/>
    </radialGradient>
  </defs>
</svg>
