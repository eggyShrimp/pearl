[package]
name = "obsidian-mcp"
version = "0.1.0"
edition = "2024"
description = "Local-first semantic search MCP server for Obsidian vaults"
license = "MIT"
repository = "https://github.com/yuan/obsidian-mcp"
keywords = ["obsidian", "mcp", "semantic-search", "vault"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# MCP protocol
rmcp = { version = "1.6", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"

# Markdown & YAML
pulldown-cmark = "0.12"
serde_yml = "0.0.12"

# Embedding & HTTP
ureq = { version = "3", features = ["json"] }

# Full-text search
tantivy = "0.22"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
toml = "0.8"
directories = "6"

[profile.release]
lto = true
strip = true
codegen-units = 1
