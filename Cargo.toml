[package]
name = "pearl"
version = "0.1.0"
edition = "2024"
description = "Local-first semantic search MCP server for Obsidian vaults"
license = "MIT"
repository = "https://github.com/eggyShrimp/pearl"
keywords = ["obsidian", "mcp", "semantic-search", "vault", "embedding"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# MCP protocol
rmcp = { version = "1.6", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP server (for network transport)
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
bincode = "1"

# Markdown & YAML
pulldown-cmark = "0.12"
serde_yml = "0.0.12"

# Embedding & HTTP
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# Full-text search
tantivy = "0.22"

# Graph storage (SQLite)
rusqlite = { version = "0.31", features = ["bundled"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Utilities
anyhow = "1"
chrono = "0.4"
daemonize = "0.5"
libc = "0.2"
notify = { version = "8", features = ["macos_fsevent"] }
notify-debouncer-full = "0.5"
scopeguard = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
toml = "0.8"
directories = "6"

# Interactive CLI
cliclack = "0.5"
console = "0.16"

[profile.release]
lto = true
strip = true
codegen-units = 1
